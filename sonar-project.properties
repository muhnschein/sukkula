# What SonarQube Cloud is told about this project, read by the scanner
# .github/workflows/build.yml runs.
#
# It is a REPORT, not a gate. ci.yml and `make check` decide what is allowed
# in (spec §7), and nothing here can turn a red build green or a green build
# red.
#
# Coverage is produced by `make sonar-reports` rather than by the scanner
# itself. The reason is with the property, at the bottom.

# The key is the project's identity on sonarcloud.io, fixed when it was
# imported. The name beside it is only what the dashboard shows.
sonar.projectKey=muhnschein_sukkula
sonar.organization=muhnschein
sonar.projectName=Sukkula

# sonar.projectVersion is deliberately NOT set here. The workspace version
# lives in Cargo.toml, and a release already has to keep the spec file's in
# step with it (docs/BUILDING.md); a third copy would be a third thing to
# forget. The workflow reads Cargo.toml and passes -Dsonar.projectVersion.

sonar.sourceEncoding=UTF-8

# The whole tree, minus the exclusions below, rather than a list of source
# directories: the secrets detector runs over files no language analyser
# claims -- the spec file, the desktop entry, the shell scripts under ci/
# and scripts/ -- and those are exactly the files a token gets pasted into.
sonar.sources=.

# Test code, separated so that coverage and duplication are measured on
# what ships and not on its fixtures.
#
# It catches less than it looks like it does: Rust's unit tests live in
# `#[cfg(test)]` modules INSIDE the files they test, and there is no moving
# them. What it does catch is the integration and hostile-input tests, the
# fuzz crate, the C++ and QML tests, the Silica doubles, and the C harness
# over the C ABI -- which is where near-identical code is supposed to be.
#
# A file may not be in both sets, so every path here appears in
# sonar.exclusions as well. The scanner's complaint when it does not is
# "File X can't be indexed twice".
sonar.tests=\
    crates/sukkula-core/tests,\
    crates/sukkula-engine/tests,\
    crates/sukkula-ffi/tests,\
    fuzz,\
    tests,\
    qml-stubs,\
    ci/ffi-harness

sonar.exclusions=\
    third_party/**,\
    vendor/**,\
    **/target/**,\
    translations/**,\
    icons/**,\
    ci/harbour/**,\
    ci/fixtures/**,\
    crates/sukkula-core/tests/**,\
    crates/sukkula-engine/tests/**,\
    crates/sukkula-ffi/tests/**,\
    fuzz/**,\
    tests/**,\
    qml-stubs/**,\
    ci/ffi-harness/**,\
    **/*.png

# Binary and generated inputs inside the test tree, which sonar.exclusions
# does not reach -- that list governs main sources only. The QML tests'
# JavaScript helpers open with `.pragma library`, which is Qt's dialect and
# not ECMAScript: the scanner cannot parse a line of them, and says so on
# every run.
sonar.test.exclusions=\
    **/target/**,\
    fuzz/seeds/**,\
    fuzz/dicts/**,\
    fuzz/corpus/**,\
    fuzz/artifacts/**,\
    tests/qml/**/*.js,\
    **/*.png

# What is in the tree but is not this project's to answer for:
#
# third_party/ is open-quickshare's core_lib and mdns-sd, upstream plus the
# patches beside them, and vendor/ the crates `cargo vendor` writes for the
# offline SDK build. Their defects are upstream's, and reporting them here
# buries ours under code nobody in this repository may fix; the patches are
# what ci/vendor-check.sh and the tests hold to account. **/target/** is
# whatever cargo left.
#
# translations/ is generated by lupdate, and its files are the reason this
# list is not optional: a Qt catalogue is named .ts, so the scanner indexes
# each one as TypeScript. They are XML.
#
# ci/harbour/ is Jolla's validator's rule lists, copied from upstream
# (ci/harbour/UPSTREAM), and ci/fixtures/ the deliberately broken trees the
# Harbour selftest must reject -- one of them a main.cpp. icons/ is rendered
# artwork; a PNG costs a scan each and prints "Invalid character encountered
# ... for encoding UTF-8" on every run. The fuzz seeds are binary for the
# same reason.
#
# C and C++ need no build wrapper: without a compilation database, SonarQube
# Cloud's CI analysis deduces the compiler options itself (AutoConfig) and
# prints how much of the code it understood in the scanner log.

# --- Rust ---------------------------------------------------------------
#
# The Sonar Rust analyser can run Clippy itself, and that is switched off
# because it would not run the clippy that gates this project: ci.yml runs
# it with `--locked --all-targets -D warnings`, over the workspace and then
# each protocol feature alone, and proves clippy.toml's bans fire.
#
# Nor is a clippy report handed over in its place. The gate denies warnings,
# so a finding in this project's code fails it and never reaches a branch
# this analyses.
#
# Sonar's own Rust rules are unaffected: this disables the external Clippy
# pass, not the analyser.
sonar.rust.clippy.enabled=false

# Coverage, from `cargo llvm-cov`, written by `make sonar-reports`.
#
# The scanner never measures coverage; it only imports a report. Without one
# the reading is a confident 0.0% rather than "no data". Absent reports are
# a warning in the scanner log, not a failure, so a run that skipped them
# degrades to "no coverage data" rather than breaking.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info

# The report covers the Rust workspace, and nothing else can have one:
#
#   src/ is the C++ shell. tests/run-cpp-tests.sh drives it under ASan and
#   UBSan, but nothing measures it, so every line would count as coverable
#   and never covered.
#   qml/ is not a language the scanner reads, and Qt's engine has no
#   coverage tool for the JavaScript that would sit beside it.
#
# Left in, one changed line in either reads as 0% coverage on new code and
# fails the quality gate on a change that says nothing about testing.
# Excluded from coverage, not from analysis: their issues still count.
sonar.coverage.exclusions=src/**,qml/**
