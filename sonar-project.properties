# What SonarQube Cloud is told about this project, read by the scanner
# .github/workflows/build.yml runs.
#
# It is a REPORT, not a gate. Spec §7 lists what a change must pass to merge,
# and nothing here can turn a red build green or a green build red.
#
# Coverage is produced by the workflow rather than by the scanner itself. The
# reason is with the property, at the bottom.

# The key is the project's identity on sonarcloud.io, fixed when it was
# imported. The name beside it is only what the dashboard shows.
sonar.projectKey=muhnschein_sukkula
sonar.organization=muhnschein
sonar.projectName=Sukkula

# sonar.projectVersion is deliberately NOT set here. The workspace version
# lives in Cargo.toml, and the workflow reads it from there and passes
# -Dsonar.projectVersion on the command line.

sonar.sourceEncoding=UTF-8

# The whole tree, minus the exclusions below, rather than a list of source
# directories: the secrets detector runs over files no language analyser
# claims -- the spec file, the desktop entry, the shell scripts -- and those
# are exactly the files a token gets pasted into.
sonar.sources=.

# sonar.tests is not set yet. Rust's unit tests live in `#[cfg(test)]`
# modules inside the files they test, so there is nothing to separate until
# integration tests (crates/*/tests) or fuzz targets (fuzz/) exist. The
# scanner refuses a path that does not exist, so they are added then -- and
# every path added there must appear in sonar.exclusions too, or the scanner
# stops with "File X can't be indexed twice".

sonar.exclusions=\
    third_party/**,\
    vendor/**,\
    **/target/**,\
    translations/**,\
    icons/**,\
    store/**,\
    fuzz/corpus/**,\
    fuzz/artifacts/**,\
    **/*.png

# What is in the tree, or will be, but is not this project's to answer for:
#
# third_party/ holds patched upstream code (rqs_lib) and vendor/ the crates
# `cargo vendor` writes for the offline SDK build (spec §6). Their defects
# are upstream's, and reporting them here buries ours under code nobody in
# this repository may fix. **/target/** is whatever cargo left.
#
# translations/ is generated by lupdate, and it is the reason this list is
# not optional: a Qt catalogue is named .ts, so the scanner indexes each one
# as TypeScript. They are XML. icons/ and store/ are rendered artwork; a PNG
# costs a scan each and prints "Invalid character encountered ... for
# encoding UTF-8" on every run. The fuzz corpus is machine output.

# --- Rust ---------------------------------------------------------------
#
# The Sonar Rust analyser can run Clippy itself, and that is switched off: it
# would run a second clippy, with its own flags, beside the `clippy -D
# warnings` spec §7 puts in the gate. The workspace lints deny warnings, so
# a finding in this project's code fails the build and never reaches a
# branch this analyses.
#
# Sonar's own Rust rules are unaffected: this disables the external Clippy
# pass, not the analyser.
sonar.rust.clippy.enabled=false

# Coverage, from `cargo llvm-cov`, written by the workflow's Coverage step.
#
# The scanner never measures coverage; it only imports a report. Without one
# the reading is a confident 0.0% rather than "no data". Absent reports are
# a warning in the scanner log, not a failure, so a run that skipped them
# degrades to "no coverage data" rather than breaking.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info

# Nothing under qml/ can have coverage data: QML is not a language the
# scanner reads, and the JavaScript beside it runs inside Qt's engine, which
# has no coverage tool. Left in, one changed line of it reads as 0% coverage
# on new code and fails the quality gate on a change no test could reach.
#
# Excluded from coverage, not from analysis: its issues still count.
sonar.coverage.exclusions=qml/**
