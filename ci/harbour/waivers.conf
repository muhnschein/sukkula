# Harbour rules this package knowingly breaks, and why.
#
# Sukkula has none, and this file is meant to stay that way: the spec
# (§2) puts anything the validator rejects out of scope rather than
# worked around. It exists so that the day a blocker is found it is
# written down here, with its reason, instead of being hidden by a
# weakened check -- and so that both checks keep the machinery to say so.
#
#     <checker>  <id>  <subject glob>  <message glob>   # reason
#
#   source  a finding of ci/harbour-check.sh; <id> is its check ID
#           (docs/HARBOUR.md), matched exactly
#   rpm     a finding of Jolla's validator, in ci/harbour-validate-rpm.sh;
#           <id> is its severity, ERROR or WARNING, matched exactly
#
# Subject and message are bash globs, and a check waives a finding only
# when all three fields match, so a waiver excuses one known finding and
# never every finding about a path; a message glob of nothing but `*` and
# `?` is refused. The message runs to the `#`, and the reason after it is
# required. Each check reads only its own lines, fails on a malformed line
# of either kind, and fails on a waiver of its own that matched nothing,
# so an entry cannot outlive what it excuses. ci/harbour-waivers.sh is the
# one parser; docs/HARBOUR.md has the policy.
