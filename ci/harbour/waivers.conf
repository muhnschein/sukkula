# Harbour rules this package knowingly breaks, and why.
#
# Sukkula has none, and this file is meant to stay that way: the spec
# (§2) puts anything the validator rejects out of scope rather than
# worked around. It exists so that the day a blocker is found it is
# written down here, with its reason, instead of being hidden by a
# weakened check -- and so that both checks keep the machinery to say so.
#
#     <check id>  <subject glob>  <message glob>   # reason
#
# ci/harbour-check.sh matches its own findings on the id and the subject.
# ci/harbour-validate-rpm.sh matches the real validator's subject *and*
# message, for its ERROR and WARNING lines alike, so a waiver excuses one
# known finding about a path and never every finding about it. Both are
# bash globs. A waiver that matches nothing fails the source check, so an
# entry cannot outlive what it excuses. docs/HARBOUR.md has the policy.
