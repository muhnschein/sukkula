# Dependencies ci/check-deps.sh would otherwise refuse, each with its scope
# and the reason it is accepted. Reviewed like code: an entry here is a
# decision, and spec §6 wants one line of reason for every dependency.
#
#     <crate> or <crate>/<feature>   dev|ship   reason
#
#   dev   present in Cargo.lock, never in what the phone runs: check-deps
#         proves it is absent from sukkula-ffi's aarch64 graph.
#   ship  compiled into the phone build, knowingly.
#
# Only the "allow-listable" kinds can appear here -- Bluetooth stacks,
# process-spawning crates, and tokio's `process` feature. A second TLS
# stack, crypto provider, D-Bus stack or async runtime, and a vendored
# libdbus, are refused outright and have no entry to write. An entry that
# stops matching anything fails the check, so this file cannot outlive what
# it excuses.

# proptest's default `fork` feature runs a failing case in a child process
# (rusty-fork) and waits on it with a timeout (wait-timeout). Tests only;
# check-deps proves neither reaches the engine.
rusty-fork     dev   proptest's fork mode, tests only
wait-timeout   dev   rusty-fork's child wait, tests only

# The LocalSend core asks for tokio's `full` feature set, and cargo unifies
# features, so tokio::process is compiled into the engine. Nothing calls it:
# clippy.toml bans tokio::process::Command in our crates (S8), the LocalSend
# core does not use it, and the vendored rqs_lib's nmcli path is compiled
# out (Q6). Drop this entry the day the core narrows its tokio features.
tokio/process  ship  enabled by the LocalSend core's tokio "full"; unused, and banned in our code (S8)
