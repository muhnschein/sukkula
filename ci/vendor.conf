# Vendored crates, and the upstream each must equal once its patches are
# applied (ci/vendor-check.sh). One line per crate:
#
#     <name> <upstream git url> <40-hex commit> <subdirectory> <vendored dir>
#
# or, for a crates.io release, the published archive pinned by its sha256
# (the checksum Cargo.lock records for it), and the directory it unpacks to:
#
#     <name> <.crate url> <64-hex sha256> <name>-<version> <vendored dir>
#
# The patches live beside the vendored copy, kept separate so each can be
# dropped as upstream merges it (spec §5). vendor-check finds them at the
# first of these that exists, and refuses when more than one does:
#
#     third_party/<name>.patch            one patch (piirit's convention)
#     third_party/patches/<name>/*.patch
#     third_party/<name>-patches/*.patch
#     third_party/<name>.patches/*.patch
#
# A directory is applied in the order of its `series` file when it has one,
# in sorted order otherwise.
#
# open-quickshare's core library at the commit spec §5 read (Q1-Q7).
rqs_lib  https://github.com/ignotusbucius/open-quickshare  5a31145163ee22ab9cf1c7d3dffd74355febe93f  core_lib  third_party/rqs_lib
