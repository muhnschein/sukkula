[package]
name = "sukkula-ffi"
description = "The C ABI the Qt shell links: five functions, JSON in and out, and the only unsafe code in Sukkula."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sukkula_ffi"
crate-type = ["staticlib", "rlib"]

[features]
default = ["sukkula-engine/default"]

[dependencies]
sukkula-core.workspace = true
sukkula-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# QR codes for sukkula_scan_qr's tests to find; already the engine's.
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
