<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A private bus for tests/bluetooth.rs. The test passes the listen address
  with dash-dash-address, so the listen element below is never used.

  Deliberately no servicedir: nothing on the host (a real obexd, say) can
  be activated onto this bus, so "obexd missing" really is missing.
  Everything is allowed; what the adapter is tested for is how it treats
  what the fakes send, not the bus policy.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
