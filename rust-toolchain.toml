# The toolchain every Rust build in this tree uses: host tests, clippy, and
# the aarch64 static library that goes into the phone package.
#
# Pinned, not `stable`: the LocalSend core pins 1.97.1 upstream, and clippy
# drift turns `-D warnings` into a lottery. The Sailfish SDK's own Rust
# (1.75) is never used -- magic-wormhole needs 1.92 and rqs_lib is edition
# 2024 -- so the library is cross-compiled against the SDK's sysroot with
# this toolchain instead. docs/BUILDING.md has the details.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
profile = "minimal"
