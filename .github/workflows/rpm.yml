# Builds the device RPM inside the Sailfish SDK, and runs Jolla's own
# validator on it: the Harbour gate on the real package (spec §7).
#
# Not part of ci.yml: it pulls a multi-gigabyte SDK image and cross-builds
# the whole engine, ten minutes and more that a pull request changing the
# program should not wait for. Some Harbour rules only the built package
# can answer -- the Requires and Provides rpm generates from the binary, the
# libraries and glibc versions the link ends up needing, whether main()
# survives the strip, the strings(1) the validator runs over every file --
# so it runs:
#
#   - on every push to main, which is every change, once it has merged. A
#     change to the crates, the C++ shell or the QML is judged here, after
#     the fact: a red run on main is a package Harbour would refuse, and
#     the fix is the next pull request.
#   - on the pull requests that change the packaging itself (the paths
#     below): the spec, what is installed beside the binary, the lockfile
#     and toolchain a dependency or compiler bump moves the Requires and
#     glibc versions with, and what builds and judges the package. Those
#     are rare, and they are the ones this run exists for.
#   - from the Actions tab, on any branch: dispatch it to validate a
#     change to the program before it merges.
#   - on a `v*` or `build-*` tag.
#
# ci/harbour-check.sh's P.6 fails a tree that stops running it on main, or
# whose pull_request list leaves out a packaging path.
#
# aarch64 and Sailfish OS 5.2 only (spec §2): the SDK image below carries
# that one target, and nothing here has a second.
#
# The route (docs/BUILDING.md): the engine is cross-compiled on the runner
# by the pinned Rust with the SDK's own aarch64 GCC and target sysroot,
# lifted out of the image; then mb2 builds the Qt shell against it inside
# the image and makes the RPM. scripts/build-rpm.sh holds each step, and
# `make rpm` runs the same ones.
name: rpm

on:
  workflow_dispatch:
    inputs:
      release:
        description: >
          Cut a release: the version to publish, which has to be what
          rpm/harbour-sukkula.spec says, run on main. The commit is tagged
          v<version> and a GitHub release goes up with the package. Leave
          empty for an ordinary build.
        type: string
        default: ""
  push:
    # Everything that merges, validated once it has.
    branches: [main]
    # `v*` for a release. `build-*` is a throwaway handle for running this
    # before it reaches the default branch, since workflow_dispatch only
    # becomes available once a workflow is on main.
    tags: ["v*", "build-*"]
  pull_request:
    paths:
      # The packaging: the spec, what is installed beside the binary, and
      # what decides what the binary links against.
      - "rpm/**"
      - "icons/**"
      - "harbour-sukkula.pro"
      - "harbour-sukkula.desktop"
      - "Cargo.lock"
      - "**/build.rs"
      - "rust-toolchain.toml"
      # What builds and judges it.
      - ".github/workflows/rpm.yml"
      - "ci/build-sdk-image.sh"
      - "ci/sdk-image.digests"
      - "ci/check-elf.sh"
      - "ci/harbour-validate-rpm.sh"
      - "ci/harbour-waivers.sh"
      - "ci/harbour/**"
      - "scripts/build-rpm.sh"
      - "scripts/cross-build-rust.sh"

# A pull request's new push supersedes its run in flight; pushes to main,
# tags and dispatches are their own groups, so a merge never cancels the
# validation of the one before it. Keyed on the pull request's number, not
# its branch: `head_ref` is a fork's bare branch name, so two forks' `main`
# or `patch-1` would share a group and cancel each other's runs.
concurrency:
  group: rpm-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Reading the tree is all the workflow as a whole needs; each job says what
# more it holds, so neither holds the other's.
permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # To pull the derived SDK image from this repository's registry, and
      # nothing more. This job runs a pull request's scripts and every
      # crate's build script, so it holds no token that can publish: the
      # image is published by sdk-image.yml alone, from main, and is pulled
      # here only by the digest the reviewed tree pins ("Get the SDK
      # image").
      packages: read
    env:
      SFOS: "5.2.0.15"
      ARCH: aarch64
      RELEASE: ${{ inputs.release || '' }}
      # Where the SDK's cross toolchain and sysroot are lifted to.
      ROOTFS: /home/runner/sukkula-sdk
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that a `v*` tag can be proved to be on
          # main (the stamp step below).
          fetch-depth: 0
          # Nothing after the checkout talks to the repository, and the
          # build runs every crate's build script: no token is left behind
          # in .git/config for one to find.
          persist-credentials: false

      # ci/build-sdk-image.sh says what this image is and why it is not
      # upstream's; its name carries a hash of that script and the spec's
      # BuildRequires (scripts/build-rpm.sh image). It is never pulled by
      # that name. A tag is a pointer anyone who can write to the registry
      # can move -- a branch's own workflow, a build script holding a
      # token -- and this image compiles, links and packages what a
      # release ships. So the image is pulled by the digest
      # ci/sdk-image.digests pins for it, which docker checks as it pulls;
      # with no digest pinned, or none this registry serves, it is derived
      # here, from the upstream image ci/build-sdk-image.sh pins by digest.
      # Nothing here publishes. docs/BUILDING.md, "The SDK image".
      - name: Get the SDK image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image=$(./scripts/build-rpm.sh image)
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          pulled=0
          ./scripts/build-rpm.sh pull "$image" && pulled=1
          docker logout ghcr.io
          if [ "$pulled" = 0 ]; then
            echo "::notice::no pinned $image to pull; deriving it, which makes this run slower"
            # Room for the upstream image and the flattened one at once.
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                        "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
            ./ci/build-sdk-image.sh "$SFOS" "$ARCH" "$image"
          fi
          id=$(docker image inspect --format '{{.Id}}' "$image")
          echo "SDK_IMAGE_ID=${id#sha256:}" >> "$GITHUB_ENV"

      # Every build would otherwise produce harbour-sukkula-0.1.0-1: the
      # same NEVRA every time, so `rpm -U` on a phone that already has one
      # does nothing while the file says it is new. The run number is
      # monotonic, so each build is an upgrade of the last. A release
      # builds the spec's own Release: 1, and has to say what the spec says.
      #
      # Digits and periods only: Harbour rejects any other character in
      # Release (ci/harbour-check.sh reads the stamp below and checks it).
      # A test build is told apart by the short SHA in its artifact name.
      #
      # A release is cut from main, by either path: a dispatch has to run
      # on main, and a `v*` tag has to name a commit main contains, so a
      # tag pushed on an unreviewed branch commit is refused before
      # anything is built or published. That guards against a mistake, not
      # an attack: a tag runs the workflow file of the commit it names,
      # which whoever pushed it controls; only a tag ruleset on `v*` stops
      # that (docs/BUILDING.md, "Cutting a release").
      - name: Stamp the build so each one is its own package
        run: |
          short=$(git rev-parse --short HEAD)
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-sukkula.spec)
          wanted=""
          case "$GITHUB_REF" in
            refs/tags/v*)
              wanted=${GITHUB_REF#refs/tags/v}
              main=refs/remotes/origin/main
              git rev-parse -q --verify "$main" >/dev/null || {
                echo "::error::$main was not fetched, so $GITHUB_REF cannot be proved to be on main"; exit 1; }
              git merge-base --is-ancestor "$GITHUB_SHA" "$main" || {
                echo "::error::$GITHUB_REF names $GITHUB_SHA, which main does not contain; a release is cut from main"; exit 1; }
              ;;
          esac
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::a release is cut on main, not on $GITHUB_REF"; exit 1; }
            wanted=$RELEASE
          fi
          if [ -n "$wanted" ]; then
            [ "$wanted" = "$version" ] || {
              echo "::error::release $wanted, but rpm/harbour-sukkula.spec says Version: $version"; exit 1; }
            release="1"
          else
            release="1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^Release:.*/Release:    ${release}/" rpm/harbour-sukkula.spec
          grep '^Version:\|^Release:' rpm/harbour-sukkula.spec
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"

      # The SDK's cross compilers are 32-bit x86 programs; rpm, cpio, file
      # and binutils are what the checks after the build read the package
      # with.
      - name: Install host prerequisites
        run: |
          sudo dpkg --add-architecture i386
          ./ci/apt-install.sh libc6:i386 libstdc++6:i386 zlib1g:i386 \
            rpm rpm2cpio cpio file binutils

      - name: Lift the cross toolchain and sysroot out of the image
        run: ./scripts/build-rpm.sh lift "$IMAGE" "$ROOTFS"

      # The engine's dependencies depend on the lockfile, the toolchain and
      # the sysroot they were compiled against, and on nothing else.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: sdk-${{ env.SFOS }}-${{ env.SDK_IMAGE_ID }}

      # The pinned Rust, the SDK's GCC 10, the 5.2 sysroot; then the four
      # entry points, the native libraries and a probe link, checked.
      - name: Cross-build the engine
        run: ./scripts/build-rpm.sh engine "$ROOTFS"

      - name: Build the RPM
        run: ./scripts/build-rpm.sh package "$IMAGE"

      - name: Show what was built
        run: |
          find RPMS -name '*.rpm' | sort | while read -r f; do
            echo "== $f"
            rpm -qip "$f"
            echo "-- files"; rpm -qlp "$f"
            echo "-- requires"; rpm -qp --requires "$f"
            echo "-- provides"; rpm -qp --provides "$f"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbour-sukkula-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

      # The authority: Jolla's rpmvalidation.sh, the same script
      # `sfdk check -s harbour` runs, at the commit ci/harbour/UPSTREAM pins,
      # plus the rules ci/check-elf.sh reads off the binary and the engine's
      # library (stripped, main() exported, the C ABI alone exported, the
      # RPATH, glibc no newer than the target's, the hardening, the TLS
      # layout).
      # Any finding fails the job -- Sukkula waives nothing
      # (ci/harbour/waivers.conf), so a red step here is a package Harbour
      # would reject or query. After the upload, deliberately: a package
      # Harbour would reject is still one worth having on a phone while
      # working out why.
      - name: Validate the RPM against Harbour's rules
        run: |
          rpm=$(find RPMS -name 'harbour-sukkula-*.aarch64.rpm' ! -name '*debug*' | sort | tail -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ./scripts/build-rpm.sh check "$rpm" "$ROOTFS"

  # A release: the package the job above built and validated goes on a
  # GitHub release named v<version>. Its own job so that `contents: write`
  # is held only here, by a few commands, and never by the build running an
  # SDK image with --privileged. From a `v*` tag the tag is there already
  # and --verify-tag refuses to invent one; from a dispatch the release
  # makes the tag, on the commit this run checked out.
  release:
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the package this run built
        run: gh run download "$GITHUB_RUN_ID" --dir rpms

      # The device package and its checksum, and nothing else.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find rpms -name 'harbour-sukkula-*.aarch64.rpm' ! -name '*debug*' \
               ! -name '*.src.rpm' -exec cp {} assets/ \;
          [ -n "$(ls assets)" ] || { echo "::error::no device RPM to release"; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
            where=(--target "$GITHUB_SHA")
          else
            version=${GITHUB_REF_NAME#v}
            where=(--verify-tag)
          fi
          {
            echo "Sukkula $version for the Jolla Phone 2026: Sailfish OS 5.2 and later, aarch64."
            echo
            echo "Built with the Sailfish SDK 5.2.0.15 and passed Jolla's Harbour validator"
            echo "(rpmvalidation.sh) with no findings. Distributed through Harbour; this"
            echo "page carries the same package for testing."
          } > notes.md
          gh release create "v$version" "${where[@]}" \
            --title "Sukkula $version" \
            --notes-file notes.md --generate-notes \
            assets/*
